[project]
name = "mcp-finance-tools"
version = "0.1.0"
description = "A read-only MCP server that gives AI agents safe finance tools over a synthetic ledger."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Tishan Perera" }]
requires-python = ">=3.10"
dependencies = ["mcp>=1.10,<3"]

[project.urls]
Repository = "https://github.com/tishan-perera/poc.mcp-finance-tools"

[project.scripts]
mcp-finance-tools = "mcp_finance_tools.server:main"
mcp-finance-viewer = "mcp_finance_tools.viewer:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_finance_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
